---
cluster:
  - "cardinal"
form:
  - auto_accounts
  - mode
  - working_dir
  - bc_num_hours
  - node_type
  - gpus
  - num_cores
  - vllm_public_select
  - vllm_model_path
  - vllm_model_select
  - jupyter_version
  - bc_email_on_started
attributes:
  jupyter_version:
    widget: 'select'
    options:
      - [
          '4.1.5', '4.1.5',
        ]
  vllm_public_select:
    widget: select
    label: "Shared or Private Model Repository"
    options:
      - ['Shared', 'shared', data-hide-vllm-model-select: false]
      - ['Private', 'private', data-hide-vllm-model-path: false]
  vllm_model_path:
    widget: "path_selector"
    hide_by_default: true
    label: "Private Vllm Model"
    show_hidden: true
    show_files: false
    help: "Select which model to load. It will be in $HF_HOME/hub: Select a directory containing a model, where the directory's name is of the format 'models--meta-llama--Llama-3.2-3B'. Invalid directory choice will result in an error, and you will not be able to submit the job."
  vllm_model_select:
    widget: select
    label: "Shared Vllm Model"
    hide_by_default: true
    options:
      #- [ 'deepseek-ai/DeepSeek-R1-Distill-Qwen-32B', 'deepseek-ai/DeepSeek-R1-Distill-Qwen-32B' ] #not enough VRAM on single H100, also doesn't run with two? 
      - [ 'google/gemma-3-27b-it', 'google/gemma-3-27b-it' ] #runs on an H100
      - [ 'meta-llama/Llama-3.2-3B', 'meta-llama/Llama-3.2-3B' ] #runs on an H100
      - [ 'microsoft/phi-4', 'microsoft/phi-4' ] #runs on an H100
      - [ 'mistralai/Mistral-Small-3.1-24B-Instruct-2503', 'mistralai/Mistral-Small-3.1-24B-Instruct-2503' ] #runs on an H100
      #- [ 'mistralai/Voxtral-Mini-4B-Realtime-2602', 'mistralai/Voxtral-Mini-4B-Realtime-2602' ] #unsupported architecture as of vllm 0.14.1
      - [ 'openai/gpt-oss-20b', 'openai/gpt-oss-20b' ] #runs on an H100
      - [ 'openai/whisper-large-v3', 'openai/whisper-large-v3' ] #seems to run, audio api untested
      - [ 'openai/whisper-small', 'openai/whisper-small' ] #untested
      - [ 'Qwen/Qwen2.5-0.5B-Instruct', 'Qwen/Qwen2.5-0.5B-Instruct' ]
      - [ 'Qwen/Qwen2.5-Omni-3B', 'Qwen/Qwen2.5-Omni-3B' ]
      - [ 'Qwen/Qwen2.5-Omni-7B-AWQ', 'Qwen/Qwen2.5-Omni-7B-AWQ' ]
      - [ 'Qwen/Qwen3-0.6B', 'Qwen/Qwen3-0.6B' ]
      - [ 'Qwen/Qwen3-30B-A3B', 'Qwen/Qwen3-30B-A3B' ]
      - [ 'Qwen/Qwen3-8B', 'Qwen/Qwen3-8B' ]
      - [ 'Qwen/Qwen3-Embedding-8B', 'Qwen/Qwen3-Embedding-8B' ]
      - [ 'Qwen/Qwen3-Omni-30B-A3B-Instruct', 'Qwen/Qwen3-Omni-30B-A3B-Instruct' ] #runs on an H100
      - [ 'Qwen/Qwen3.5-9B', 'Qwen/Qwen3.5-9B' ]
      - [ 'TinyLlama/TinyLlama_v1.1', 'TinyLlama/TinyLlama_v1.1' ] 
  mode:
    widget: "radio"
    value: "1"
    options:
      - ["Jupyter Lab", "1"]
      - ["Jupyter Notebook", "0"]
  working_dir:
    widget: "path_selector"
    label: "Root Directory"
    show_hidden: false
    show_files: false   # Only display directories
    help: "Select your project directory; defaults to $HOME"
  num_cores:
    widget: "number_field"
    label: "Number of cores"
    value: 1
    help: |
      Number of cores on node type. Minimums and maximums will change
      depending on the choice of node type and cluster.
    min: 1
    max: 28
    step: 1
  node_type:
    widget: select
    label: "Node type"
    help: |
      - **any** - (*96 cores*) Use any available Cardinal node. This reduces the
        wait time as there are no node requirements.
      - **any gpu** - (*96 cores*) Use a Cardinal node that has [NVIDIA NVIDIA H100
        GPUs](https://www.nvidia.com/en-us/data-center/h100/). Recommended for faster LLM processing.
        Suggest to select 1 for the number of GPUs to start.
    options:
      - [
          "any",     "any",
          data-hide-gpus: true,
          data-min-num-cores-for-cluster-pitzer: 1,
          data-max-num-cores-for-cluster-pitzer: 48,
          data-min-num-cores-for-cluster-ascend: 1,
          data-max-num-cores-for-cluster-ascend: 118,
          data-min-num-cores-for-cluster-cardinal: 1,
          data-max-num-cores-for-cluster-cardinal: 96,
          data-option-for-cluster-kubernetes: false,
          data-option-for-cluster-kubernetes-test: false,
          data-option-for-cluster-kubernetes-dev: false
        ]
      - [
          "any gpu",     "gpu",
          data-min-num-cores-for-cluster-pitzer: 1,
          data-max-num-cores-for-cluster-pitzer: 48,
          data-option-for-cluster-kubernetes: false,
          data-option-for-cluster-kubernetes-test: false,
          data-option-for-cluster-kubernetes-dev: false,
          data-min-num-cores-for-cluster-ascend: 1,
          data-max-num-cores-for-cluster-ascend: 118,
          data-min-num-cores-for-cluster-cardinal: 1,
          data-max-num-cores-for-cluster-cardinal: 96,
        ]
  gpus:
    widget: number_field
    min: 0
    max: 4
    value: 1
